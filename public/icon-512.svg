<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle with smooth gradient -->
  <rect width="512" height="512" rx="128" fill="url(#glassGrad)" />
  
  <!-- Window frame subtle outline -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Glass Pane -->
    <rect x="10" y="10" width="280" height="280" rx="36" fill="#ffffff" fill-opacity="0.95" stroke="#e0f2fe" stroke-width="4"/>
    
    <!-- Window Grid -->
    <line x1="150" y1="20" x2="150" y2="280" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="150" x2="280" y2="150" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Diagonal Squeegee / Wiper Cleaning Effect -->
    <path d="M40 80 L220 260" stroke="#0284c7" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Squeegee Handle & Blade -->
    <g transform="translate(130, 40) rotate(25)">
      <!-- Blade -->
      <rect x="0" y="0" width="120" height="14" rx="4" fill="#0284c7" />
      <rect x="5" y="14" width="110" height="6" rx="2" fill="#38bdf8" />
      <!-- Handle -->
      <path d="M60 14 L60 90" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
      <rect x="52" y="55" width="16" height="35" rx="5" fill="#334155"/>
    </g>

    <!-- Sparkles -->
    <!-- Sparkle 1 Top Right -->
    <path d="M245 45 Q245 70 270 70 Q245 70 245 95 Q245 70 220 70 Q245 70 245 45 Z" fill="#38bdf8"/>
    <circle cx="245" cy="70" r="3" fill="#ffffff"/>
    
    <!-- Sparkle 2 Bottom Left -->
    <path d="M60 210 Q60 228 78 228 Q60 228 60 246 Q60 228 42 228 Q60 228 60 210 Z" fill="#0284c7"/>
    
    <!-- Sparkle 3 Center Small -->
    <path d="M190 190 Q190 200 200 200 Q190 200 190 210 Q190 200 180 200 Q190 200 190 190 Z" fill="#38bdf8"/>
  </g>
</svg>
